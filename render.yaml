services:
  - type: web
    name: world-archives
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: USER_DATA_FILE
        value: /var/data/user_data.json
    disk:
      name: world-archives-user-data
      mountPath: /var/data
      sizeGB: 1
