services:
  - type: web
    name: world-archives
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    envVars:
      - key: USER_DATA_FILE
        value: /var/data/user_data.json
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: PYTHONOPTIMIZE
        value: 1
    disk:
      name: world-archives-user-data
      mountPath: /var/data
      sizeGB: 1
